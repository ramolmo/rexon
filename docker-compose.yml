version: '3.8'

services:
  rexon-app:
    build: .
    container_name: rexon-business-os
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-rexon_secret_token_2026}
      - SUPABASE_URL=${SUPABASE_URL:-https://pxejdzlrcesjepndgpyo.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-sb_publishable_zhiBHjv-fhhEhy7wvX52AA_1sE0sSSL}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-https://datafow-ramolmoaran.aws-ap-south-1.turso.io}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL:-https://ramolmo.github.io}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode !== 200) process.exit(1); });"]
      interval: 30s
      timeout: 5s
      retries: 3
